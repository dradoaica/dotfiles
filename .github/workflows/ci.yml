name: CI

on:
  push:
  pull_request:
  # Weekly, so a PPA, repository or release that stops working is caught before the next fresh install
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Actions are pinned to a commit, since a tag can be moved to other code; Dependabot updates the pins and the
# version comments.

# The jobs only read the repository
permissions:
  contents: read

defaults:
  run:
    shell: bash

# Lint, link and sources run in a container of the release this repository targets, not on the runner's own Ubuntu.
# Each job has a time limit, so a server that stops answering cannot hold a runner for GitHub's default of 6 hours.
jobs:
  sources:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    # The checks retry rate-limited requests for up to 2 minutes each
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install curl and jq
        run: apt-get update && apt-get install -y ca-certificates curl jq
      - name: Check the PPAs, repositories, downloads, GitHub releases and packages the installer uses
        run: bash scripts/check-sources.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install make and shellcheck
        run: apt-get update && apt-get install -y make shellcheck
      - name: Shellcheck
        # The same files as `make lint` locally
        run: make lint

  link:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Stow
        run: apt-get update && apt-get install -y stow
      - name: Link into a fresh home directory
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          cp /etc/skel/.bashrc /etc/skel/.profile "$HOME/"
          bash scripts/link.sh
          bash scripts/link.sh --check
          # The existing .bashrc and .profile must have been backed up
          test -f "$HOME"/.dotfiles-backup/*/.bashrc
          # A second run must not back up anything
          if bash scripts/link.sh | grep "Backed up"; then exit 1; fi
      - name: Remove a link to a file that is no longer in the repository
        run: |
          export HOME="$RUNNER_TEMP/home"
          ln -s "$PWD/home/bash/.removed" "$HOME/.removed"
          if bash scripts/link.sh --check; then exit 1; fi
          bash scripts/link.sh | grep "Removed ~/.removed"
          test ! -L "$HOME/.removed"
          bash scripts/link.sh --check
      - name: Start an interactive shell with the linked files
        run: |
          export HOME="$RUNNER_TEMP/home"
          bash -ic 'echo "NVM_DIR=$NVM_DIR"' | grep -q "NVM_DIR=$HOME/.nvm"
      - name: Keep a long history when new terminals start
        run: |
          export HOME="$RUNNER_TEMP/home"
          # Fill the file the shell keeps its history in with more than the 2000 lines Ubuntu's .bashrc trims
          # ~/.bash_history to, then check that new terminals still load all of it
          histfile="$(bash -i <<< 'echo "$HISTFILE"' 2> /dev/null | tail -1)"
          seq 1 5000 | sed 's/^/echo /' > "$histfile"
          for shell in first second; do
            entries="$(bash -i <<< 'history | wc -l' 2> /dev/null | tail -1)"
            echo "The $shell shell loaded $entries history entries from ${histfile#"$HOME"/}"
            [ "$entries" -ge 5000 ]
          done
      - name: Start login shells with the linked files, as the GNOME session does
        run: |
          export HOME="$RUNNER_TEMP/home"
          bash -lc 'echo "NVM_DIR=$NVM_DIR"' | grep -q "NVM_DIR=$HOME/.nvm"
          sh -lc 'echo "NVM_DIR=$NVM_DIR"' | grep -q "NVM_DIR=$HOME/.nvm"
      - name: Unlink
        run: |
          export HOME="$RUNNER_TEMP/home"
          bash scripts/link.sh --unlink
          if bash scripts/link.sh --check; then exit 1; fi
          test ! -e "$HOME/.config/git/config"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks comments on pull requests that add a secret
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan the whole history, not just the latest commit
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub turns off a public repository's schedule after 60 days without activity, which is when the weekly check
  # matters most. Enabling the workflow from its own scheduled run resets that timer.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the weekly schedule enabled
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
