name: CI

on:
  # Branches other than main are checked through their pull request, not twice
  push:
    branches: [main]
  pull_request:
  # Weekly, so a PPA, repository or release that stops working is caught before the next fresh install
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Actions are pinned to a commit, since a tag can be moved to other code; Dependabot updates the pins and the
# version comments.

# The jobs only read the repository
permissions:
  contents: read

defaults:
  run:
    shell: bash

# Lint, sources, packages and test run in a container of the release this repository targets, not on the
# runner's own Ubuntu.
# Each job has a time limit, so a server that stops answering cannot hold a runner for GitHub's default of 6 hours.
jobs:
  sources:
    runs-on: ubuntu-latest
    # The release this repository targets, named once here (&release) and used by the other jobs (*release). Change it
    # here when moving to a new release.
    container: &release ubuntu:26.04
    # The checks retry rate-limited requests for up to 2 minutes each
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install curl and jq
        run: apt-get update && apt-get install -y ca-certificates curl jq
      - name: Check the PPAs, repositories, downloads, GitHub releases and packages the installer uses
        run: bash scripts/check-sources.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packages:
    runs-on: ubuntu-latest
    container: *release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GnuPG and sudo
        # The container runs as root and has no sudo, which the script calls
        run: apt-get update && apt-get install -y gpg sudo
      - name: Add the APT sources and check that apt can install every package in packages/apt.txt together
        run: bash scripts/packages.sh --simulate

  lint:
    runs-on: ubuntu-latest
    container: *release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install make and shellcheck
        run: apt-get update && apt-get install -y make shellcheck
      - name: Shellcheck
        # The same files as `make lint` locally
        run: make lint

  test:
    runs-on: ubuntu-latest
    container: *release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dconf, D-Bus, jq, make and Stow
        run: apt-get update && apt-get install -y dbus-daemon dconf-cli dconf-service jq make stow
      - name: Run the tests in tests/, each in an empty home directory
        # The same tests as `make test` locally
        run: make test

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks comments on pull requests that add a secret
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan the whole history, not just the latest commit
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub turns off a public repository's schedule after 60 days without activity, which is when the weekly check
  # matters most. Enabling the workflow from its own scheduled run resets that timer.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the weekly schedule enabled
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
