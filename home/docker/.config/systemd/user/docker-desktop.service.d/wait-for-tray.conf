# Docker Desktop creates its tray icon once, at startup, and does not retry if GNOME's tray (the
# AppIndicator extension's StatusNotifierWatcher) is not up yet, which happens when it starts at login.
# Wait up to 30 s for the tray first; the leading "-" starts Docker Desktop anyway if it never appears.
[Service]
ExecStartPre=-/usr/bin/gdbus wait --session --timeout 30 org.kde.StatusNotifierWatcher
